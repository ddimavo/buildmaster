plugins {
    id 'java'
}

group = 'ru.buildmaster'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

sourceSets {
    // Заглушки Vault API: нужны только для компиляции, в jar не попадают.
    // Во время работы используется настоящий Vault с сервера.
    vaultStub
}

dependencies {
    vaultStubCompileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly sourceSets.vaultStub.output
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
