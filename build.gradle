plugins {
    id 'java'
}

group = 'ru.industryreborn'
version = project.hasProperty('pluginVersion') ? project.property('pluginVersion') : '2.5.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    // API FancyHolograms (необязательный плагин): только для компиляции и тестов, в jar не попадает
    maven { url = 'https://repo.fancyinnovations.com/releases' }
    // API Plan (необязательный плагин): только для компиляции и тестов
    maven { url = 'https://repo.playeranalytics.net/releases' }
}

sourceSets {
    // Заглушки Vault API: нужны только для компиляции, в jar не попадают.
    // Во время работы используется настоящий Vault с сервера.
    vaultStub
    // Заглушки API zAuctionHouse (подмножество, см. src/zahStub/README.md): только для компиляции и тестов.
    zahStub
}

dependencies {
    vaultStubCompileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly sourceSets.vaultStub.output
    zahStubCompileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly sourceSets.zahStub.output

    compileOnly 'de.oliver:FancyHolograms:2.10.0'
    compileOnly 'com.djrapitops:plan-api:5.9-R1.3'
    testImplementation 'com.djrapitops:plan-api:5.9-R1.3'
    testImplementation 'de.oliver:FancyHolograms:2.10.0'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation sourceSets.vaultStub.output
    testImplementation sourceSets.zahStub.output
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    // без этого Gradle не пересобирает plugin.yml при смене версии (-PpluginVersion=...)
    inputs.property('pluginVersion', project.version.toString())
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
