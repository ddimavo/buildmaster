name: Auto release

# Автоматический выпуск при каждом коммите (push в main или в ветки claude/**).
# Версия берётся из build.gradle (1.11.0-SNAPSHOT -> 1.11.0):
#  - если релиза v1.11.0 ещё нет, выходит обычный релиз 1.11.0 (описание из CHANGELOG.md);
#  - если уже есть, выходит пререлиз 1.11.0-dev.<номер запуска> со списком коммитов.
# Старые пререлизы dev удаляются, остаются последние 10. Чтобы пропустить выпуск, добавьте [skip release] в сообщение коммита.
on:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Версия
        run: |
          BASE="$(sed -n "s/^version = .*: '\([0-9][0-9.]*\)\(-SNAPSHOT\)\?'$/\1/p" build.gradle | head -n1)"
          if [ -z "$BASE" ]; then
            echo "::error::Не удалось определить версию из build.gradle"
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null; then
            VERSION="$BASE-dev.$GITHUB_RUN_NUMBER"
            PRERELEASE=true
          else
            VERSION="$BASE"
            PRERELEASE=false
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "Версия выпуска: $VERSION (пререлиз: $PRERELEASE)"

      - name: Сборка и тесты
        run: gradle clean build -PpluginVersion="$VERSION" --no-daemon

      - name: Проверка jar
        run: |
          test -f "build/libs/BuildMaster-$VERSION.jar"
          unzip -p "build/libs/BuildMaster-$VERSION.jar" plugin.yml | grep -q "^version: '\?$VERSION"

      - name: Описание релиза
        run: |
          bash scripts/release-notes.sh "$VERSION" "HEAD" > release-notes.md
          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "Автоматическая сборка из коммита \`${GITHUB_SHA::7}\` (ветка \`$GITHUB_REF_NAME\`). Для обычной работы берите релизы без \`-dev\`."
              echo
              cat release-notes.md
            } > release-notes.tmp
            mv release-notes.tmp release-notes.md
          fi

      - name: Контрольная сумма
        run: |
          cd build/libs
          sha256sum "BuildMaster-$VERSION.jar" > "BuildMaster-$VERSION.jar.sha256"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BuildMaster ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: |
            build/libs/BuildMaster-${{ env.VERSION }}.jar
            build/libs/BuildMaster-${{ env.VERSION }}.jar.sha256

      - name: Очистка старых dev-пререлизов
        if: ${{ env.PRERELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "Удаляю $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
