name: Release

# Публикует готовый jar в GitHub Releases:
#  - при пуше тега v1.2.3 (тег вида v1.2.3-beta.1 публикуется как пререлиз);
#  - вручную: Actions -> Release -> Run workflow, указав версию (тег vВЕРСИЯ создастся на выбранном коммите).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без v, например 1.10.0 или 1.11.0-beta.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Версия и тег
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Некорректная версия: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Сборка и тесты
        run: gradle clean build -PpluginVersion="$VERSION" --no-daemon

      - name: Проверка jar
        run: |
          test -f "build/libs/BuildMaster-$VERSION.jar"
          unzip -p "build/libs/BuildMaster-$VERSION.jar" plugin.yml | grep -q "^version: '\?$VERSION"

      - name: Описание релиза
        run: bash scripts/release-notes.sh "$VERSION" "$TAG" > release-notes.md

      - name: Контрольная сумма
        run: |
          cd build/libs
          sha256sum "BuildMaster-$VERSION.jar" > "BuildMaster-$VERSION.jar.sha256"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BuildMaster ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/BuildMaster-${{ env.VERSION }}.jar
            build/libs/BuildMaster-${{ env.VERSION }}.jar.sha256
