name: Release

# Публикует плагин в GitHub Releases при пуше тега вида v1.2.3 (или v1.2.3-beta.1 - тогда это пререлиз).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Версия из тега
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Сборка и тесты
        run: gradle clean build -PpluginVersion="$VERSION" --no-daemon

      - name: Описание релиза
        run: bash scripts/release-notes.sh "$VERSION" "$GITHUB_REF_NAME" > release-notes.md

      - name: Контрольная сумма
        run: |
          cd build/libs
          sha256sum "BuildMaster-$VERSION.jar" > "BuildMaster-$VERSION.jar.sha256"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          name: BuildMaster ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/BuildMaster-${{ env.VERSION }}.jar
            build/libs/BuildMaster-${{ env.VERSION }}.jar.sha256
