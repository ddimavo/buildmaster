name: BuildMaster
version: '${version}'
main: ru.buildmaster.BuildMasterPlugin
api-version: '1.21'
description: Район коммерции - участки, покупка, аренда и изменение зданий
authors: [BuildMaster]
depend: [Vault]
softdepend: [WorldGuard]
commands:
  district:
    description: Управление участками
    aliases: [dt, uchastok]
    usage: /district help
permissions:
  buildmaster.use:
    description: Покупка, аренда и управление своими участками
    default: true
  buildmaster.admin:
    description: Создание и администрирование участков
    default: op
    children:
      buildmaster.bank: true
      buildmaster.grid: true
  buildmaster.bank:
    description: Работа банка - казна, проверка всех счетов, комиссии, штраф и налоги
    default: op
  buildmaster.grid:
    description: Работа электросети - станции, тариф, отчёты, отключение предприятий и районы
    default: op
  buildmaster.bypass:
    description: Обход защиты участков
    default: op
