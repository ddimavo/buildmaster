name: IndustryReborn
version: '${version}'
main: ru.industryreborn.IndustryRebornPlugin
api-version: '1.21'
description: Район коммерции - участки, покупка, аренда и изменение зданий
authors: [IndustryReborn]
depend: [Vault]
softdepend: [WorldGuard, ChestShop, MCGUI, FancyHolograms, ExcellentEconomy]
# загружаться раньше аукциона: экономика казны должна быть зарегистрирована до чтения лотов из базы
loadbefore: [zAuctionHouse]
commands:
  district:
    description: Управление участками
    aliases: [dt, uchastok]
    usage: /district help
permissions:
  industryreborn.use:
    description: Покупка, аренда и управление своими участками
    default: true
  industryreborn.admin:
    description: Создание и администрирование участков
    default: op
    children:
      industryreborn.bank: true
      industryreborn.grid: true
  industryreborn.bank:
    description: Работа банка - казна, проверка всех счетов, комиссии, штраф и налоги
    default: op
  industryreborn.grid:
    description: Работа электросети - станции, тариф, отчёты, отключение предприятий и районы
    default: op
  industryreborn.bypass:
    description: Обход защиты участков
    default: op
  # прежние имена прав (плагин назывался BuildMaster): выданные в LuckPerms и т.п. права продолжают работать
  buildmaster.use:
    description: Устаревшее имя права industryreborn.use
    default: false
    children:
      industryreborn.use: true
  buildmaster.admin:
    description: Устаревшее имя права industryreborn.admin
    default: false
    children:
      industryreborn.admin: true
  buildmaster.bank:
    description: Устаревшее имя права industryreborn.bank
    default: false
    children:
      industryreborn.bank: true
  buildmaster.grid:
    description: Устаревшее имя права industryreborn.grid
    default: false
    children:
      industryreborn.grid: true
  buildmaster.bypass:
    description: Устаревшее имя права industryreborn.bypass
    default: false
    children:
      industryreborn.bypass: true
