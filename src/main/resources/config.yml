# IndustryReborn - район коммерции


# Максимальный срок аренды в сутках, включая продления (остаток + продление не больше этого)
max-rent-days: 14

# Кнопки быстрой аренды в меню (в сутках)
rent-day-options: [1, 7, 14]

# На сколько суток списывается плата при автопродлении
autorenew-days: 7

# Длина "суток" аренды в секундах (86400 = реальные сутки). Менять только для тестов.
rent-day-seconds: 86400

# Возврат части цены при отказе от КУПЛЕННОГО участка (в процентах, 0 - без возврата)
sell-refund-percent: 0

# Максимальный объём участка в блоках
max-plot-volume: 2000000

# Можно ли телепортироваться к любому участку (меню и /district tp)
allow-visit-teleport: true

# Защита контейнеров (сундуки, бочки, печи...) от посторонних игроков
protect-containers: true

# Запретить огонь, взрывы и затекание жидкостей на участки
fire-protection: true
explosion-protection: true
liquid-protection: true

# Запрещённые предметы при обычной СТРОЙКЕ владельцем внутри участка
place-banned:
  - TNT
  - "*LAVA*"
  - "*WATER*"
  - FIRE
  - SOUL_FIRE
  - "*SPAWNER"
  - "*COMMAND_BLOCK*"
  - BARRIER
  - STRUCTURE_BLOCK
  - JIGSAW
  - BEDROCK
  - "END_PORTAL*"
  - RESPAWN_ANCHOR

# ---- Аренда, отсрочка и хранилище ----


# Отсрочка платежа при нехватке денег на автопродление (в сутках). Участок заморожен:
# строить и менять нельзя, торговля табличками работает. Потом участок отбирается.
grace-days: 3

# Сколько суток вещи лежат в хранилище игрока (потом удаляются; позже - аукцион)
storage-days: 60

# Антидюп: при поломке исходного блока здания предмет не выпадает
# (блок всё равно восстановится при сбросе здания)
original-blocks-drop-nothing: true

# ---- Лимиты владения (0 - без ограничений) ----
limits:
  total: 6
  categories:
    house: 2
    shop: 2
    workshop: 1
    restaurant: 1
    warehouse: 1
    hotel: 1
    room: 1

# ---- Модерация названий и описаний ----
moderation:
  max-name-length: 32
  max-description-length: 120

# ---- Электричество мастерских ----
# Платят только участки типа "мастерская". Вне мастерских станки обычные.
# Счёт предприятия = денежный счёт участка: с него непрерывно списывается электричество.
electricity:
  # DAILY - суточный тариф списывается непрерывно; USAGE - плата за каждую операцию на станке
  # (плавка, варка, ремонт, зачарование). Администратор может переопределить командой /district power admin.
  mode: DAILY
  # цена операции в режиме USAGE = usage-base × коэффициент станка
  usage-base: 1.0
  # тариф в сутки = база × Σ по типам [ коэффициент × Σ по станкам (1 + прогрессия × k) ]
  base-rate-per-day: 100.0
  # надбавка за каждый следующий станок того же типа (0 - выключена)
  progression-per-extra-same-type: 0.10
  stations:
    smelter: 1.0      # печь, плавильная печь, коптильня
    anvil: 1.5
    alchemy: 2.5      # варочная стойка
    enchanting: 4.0   # стол зачарований
  # простой сервера не оплачивается: за один шаг биллинговые часы идут не больше этого (сек)
  max-clock-step-seconds: 120

# ---- Электричество отелей ----
# Отель платит за электричество со своего счёта, но только за занятые номера. Потребление одного занятого номера в V в сутки =
# base-units + per-area × площадь пола (длина × ширина, блоков). Цена за V - electricity.base-rate-per-day, как у мастерских
# (номер 12 блоков = 0.32 V, то есть около 32 в сутки при цене 100 за V; настройте по таблице docs/IndustryReborn-Balance.xlsx);
# отель подключается к электростанции так же, как мастерская (/district grid). Отель всегда платит суточным тарифом.
# Когда счёт отеля пуст, на голограммах номеров показывается «Нет электричества».
hotel-electricity:
  enabled: true
  base-units: 0.2
  per-area: 0.01

# ---- Видимое выделение ----
# Выделение топором (две точки и область) и предложенный номер отеля подсвечиваются контуром из частиц; видит только сам администратор.
visual:
  selection-particles: true
  max-points: 400      # не больше столько частиц на один контур (для больших областей шаг растёт)
  range: 64            # рисуются только точки не дальше этого расстояния от игрока

# ---- Автосоздание номеров отеля по двери ----
# /district room auto <номер> <цена>: смотрите на дверь, стоя в коридоре; плагин находит замкнутое помещение за дверью.
hotel-auto:
  max-cells: 4000          # предел размера помещения (клеток свободного пространства); больше - значит, комната не замкнута
  confirm-seconds: 120     # сколько ждать подтверждения

# ---- Товары и витрина ----
# Магазины и мастерские продают товары покупателям (/district shop <участок>), склады только хранят. Товары попадают на склад
# предприятия вручную или автоматически по связи с мастерской (/district link). Цену за штуку назначает управляющий.
goods:
  # вместимость склада товаров по типам предприятий (в предметах)
  capacity: {shop: 2048, workshop: 1024, warehouse: 8192}
  # цена по умолчанию для товара без своей цены (0 - такой товар не продаётся, пока управляющий не назначит цену)
  default-price: 0
  # налог с продаж, процент: удерживается из выручки предприятия и уходит в казну
  sales-tax-percent: 0

# ---- Голограммы ----
holograms:
  # чем рисовать голограммы: auto - FancyHolograms, если он установлен, иначе встроенные сущности TextDisplay;
  # fancy - то же, но с предупреждением, если его нет; entity - всегда встроенные сущности
  backend: auto
  # маленькие голограммы над станками мастерской (статус, прогресс, сырьё, топливо, продукция); видны, когда игрок рядом
  machines: true
  # панель характеристик предприятия для управляющего над общей голограммой участка (видна только ему и администраторам)
  manager-panels: true
  # голограммы над дверями номеров отелей: номер, статус, гость, срок (видны, когда рядом игрок)
  doors: true
  # голограмма услуг и товаров мастерской и магазина (положение двигается отдельно: /district hologram services)
  services: true
  # голограммы банка: большая доска налогов, комиссий и казны (/district hologram services) и отдельная доска последних
  # операций казны (/district hologram log); положение двигается отдельно
  bank: true
  bank-log-lines: 8       # сколько последних операций показывать (до 20)
  door-view-distance: 14

# ---- Установка станков в мастерской ----
# Платный станок (печь, наковальня, варочная стойка, стол зачарований) в мастерской устанавливает только управляющий:
# цена списывается автоматически со счёта предприятия, при нехватке - с кошелька управляющего, и уходит в казну.
# Нет денег - блок не ставится, игроку объясняют причину. Станки, поставленные администратором, регистрируются бесплатно.
station-install:
  smelter: 200       # печь, плавильная печь, коптильня
  anvil: 300
  alchemy: 500       # варочная стойка
  enchanting: 1000   # стол зачарований

# ---- Лимиты станков по типам участков ----
# -1 без ограничений, 0 запрещено, N - не больше N на участок.
# crafting - верстак; furnace - печь любого вида; anvil - наковальня;
# other - прочие станки (варочная стойка, стол зачарований, точило, кузнечный стол, ткацкий станок...)
station-limits:
  house:      {crafting: -1, furnace: -1, anvil: -1, other: -1}
  shop:       {crafting: 1,  furnace: 1,  anvil: 1,  other: 0}
  workshop:   {crafting: -1, furnace: -1, anvil: -1, other: -1}
  restaurant: {crafting: 1,  furnace: 3,  anvil: 0,  other: 0}
  warehouse:  {crafting: 1,  furnace: 0,  anvil: 0,  other: 0}
  hotel:      {crafting: -1, furnace: -1, anvil: -1, other: -1}
  room:       {crafting: 1,  furnace: 1,  anvil: 0,  other: 0}

# ---- Публичные права ----
# Что управляющий может открыть для ВСЕХ посетителей: containers, stations. Пустой список - публичный режим запрещён.
public-permissions:
  house: []
  shop: []
  workshop: [stations]
  restaurant: []
  warehouse: []
  hotel: []
  room: []

# ---- Банк ----
# Значения можно менять командами /district bank admin ... (хранятся в bank.yml и важнее этих).
bank:
  # комиссии с операций по счёту предприятия, в процентах; уходят в казну
  deposit-commission-percent: 0
  withdraw-commission-percent: 0
  # штраф при изъятии участка: процент от остатка счёта (остальное возвращается управляющему)
  seizure-penalty-percent: 10
  # налог на доход от сдачи в аренду: платит арендодатель из выручки (для участков игроков и отелей)
  rent-tax-percent: 0
  # налог на имущество: сумма за период для каждого типа участка (0 - не взимается)
  property-tax-period-days: 7
  property-tax:
    house: 0
    shop: 0
    workshop: 0
    restaurant: 0
    warehouse: 0
    hotel: 0
  # операции со счётом (пополнение, снятие) только внутри здания банка
  only-in-bank: false

# ---- Электросеть ----
# Единица потребления - V. Станок потребляет свой коэффициент в V в сутки (с прогрессией),
# цена электроэнергии (electricity.base-rate-per-day) - это цена 1 V.
# Предприятие подключено ровно к одной электростанции (здание типа power_plant).
# Пока станций нет, сеть не действует и мастерские работают без подключения.
grid:
  # мощность новой электростанции, V в сутки (меняется в панели станции)
  default-capacity: 1000
  # перегрузка (потребление больше мощности): множитель тарифа станции растёт на этот шаг
  # за каждый интервал и так же снижается, когда нагрузка в норме
  surcharge-step: 0.02
  max-multiplier: 3.0
  update-interval-seconds: 600

# ---- Услуги мастерских (заказы) ----
# Клиент оплачивает услугу и отдаёт материалы (они хранятся в эскроу), мастерская выполняет заказ сама,
# пока есть электричество, клиент забирает результат, оплата поступает на счёт мастерской.
# Управляющий включает услуги и назначает цену за единицу работы (в пределах max-price).
services:
  # множитель времени выполнения (1.0 - как в игре; 0.5 - вдвое быстрее)
  time-factor: 1.0
  max-units-per-order: 256
  max-active-orders-per-workshop: 20
  max-orders-per-client: 5
  # готовый заказ, который не забрали, через столько суток уходит в хранилище клиента
  ready-expire-days: 30
  smelt:                 # переплавка: рецепты печи берутся из игры, время - из рецепта
    title: Переплавка
    default-price: 1.0   # за предмет
    max-price: 20.0
  repair:                # ремонт повреждённых предметов на наковальне
    title: Ремонт
    default-price: 10.0  # за предмет
    max-price: 100.0
    seconds-per-item: 5
  # дополнительные услуги: из input-amount предметов input получается output-amount предметов output
  # station: smelter | anvil | alchemy | enchanting
  recipes:
    compress-iron:
      title: Слитки из самородков
      station: smelter
      input: IRON_NUGGET
      input-amount: 9
      output: IRON_INGOT
      output-amount: 1
      seconds: 5
      default-price: 1.0
      max-price: 20.0
    compress-gold:
      title: Золотые слитки из самородков
      station: smelter
      input: GOLD_NUGGET
      input-amount: 9
      output: GOLD_INGOT
      output-amount: 1
      seconds: 5
      default-price: 1.0
      max-price: 20.0

# ---- Производство мастерских ----
# Каждый станок мастерской получает задание от управляющего (/district machine или shift+ПКМ по станку пустой рукой):
# печи плавят, наковальни собирают блоки, инструменты, оружие, броню и еду, стол зачарований накладывает одобренные
# администратором зачарования. Рецепты берутся из реестра игры, поэтому расход и выход такие же, как в игре.
# Сырьё лежит на общем складе мастерской; его пополняет сундук сырья (/district chest raw), продукция выкладывается в сундук
# продукции (/district chest product). Станки без задания обслуживают заказы игроков, а заказы в продукцию не попадают.
production:
  # множитель времени партии (1.0 - как в игре; 0.5 - вдвое быстрее)
  time-factor: 1.0
  # вместимость склада сырья мастерской (в предметах) и буфера продукции каждого станка (в партиях); улучшения умножают
  stock-items: 1024
  buffer-batches: 64
  # сундуков сырья и сундуков продукции на мастерскую не больше
  chests-max: 4
  # время сборки: база + за каждый предмет сырья (секунды)
  assembly-seconds-base: 4
  assembly-seconds-per-item: 0.5
  # предметы, которые нельзя производить (чтобы не получить оружие массового поражения)
  banned-outputs: [TNT, TNT_MINECART, END_CRYSTAL, RESPAWN_ANCHOR]

# Улучшения: уровни платные (со счёта предприятия, деньги уходят в казну).
# max-lines - сколько станков мастерской могут одновременно иметь задание.
# Незаданные значения уровня наследуются от предыдущего. При освобождении мастерской уровень сбрасывается.
upgrades:
  base:
    max-lines: 4          # сколько станков может иметь задание
    speed: 1.0            # скорость линий и выполнения заказов
    stock: 1.0            # множитель склада сырья
    buffer: 1.0           # множитель буфера продукции
    order-queue: 0        # прибавка к очереди заказов клиентов
  levels:
    1: {price: 3000, max-lines: 6, speed: 1.25, stock: 2.0, buffer: 2.0, order-queue: 10}
    2: {price: 8000, max-lines: 9, speed: 1.5, stock: 4.0, buffer: 4.0, order-queue: 20}
    3: {price: 20000, max-lines: 14, speed: 2.0, stock: 8.0, buffer: 8.0, order-queue: 40}

# ---- Отели ----
# Отель - участок типа hotel; номера - вложенные участки типа room (создаёт администратор:
# /district room create | template). Гость арендует номер как обычный участок (до 14 суток, продление,
# автопродление, отсрочка), оплата поступает на счёт управляющего отеля за вычетом налога на аренду
# (bank.rent-tax-percent), а если управляющего нет - в казну. Стены и дверь номера гость менять не может:
# номером считается только интерьер. При выезде вещи гостя возвращаются в его хранилище, номер сбрасывается к исходному виду.

# ---- Участки игроков (регионы WorldGuard) ----
# Игрок привязывает свой регион WorldGuard (/district region bind), администратор одобряет участок,
# после чего игрок продаёт регион или сдаёт его в аренду (до 14 суток). На время аренды регион в WorldGuard
# принадлежит арендатору; после аренды возвращается арендодателю. Вещи и постройки арендодателя при этом
# не страдают: при окончании аренды убирается только то, что поставил арендатор (предметы - в его хранилище).
# Требует плагин WorldGuard (необязательная зависимость).
player-plots:
  enabled: true
  # какие типы здания игрок может выбрать (магазины и мастерские создаёт только администрация)
  allowed-types: [house, warehouse, hotel]
  # сколько регионов может привязать один игрок (0 - без ограничений)
  max-per-player: 5
  min-volume: 100
  max-volume: 500000
  # предел цены аренды за сутки: размер региона (в тысячах блоков) × max-rent-per-1000-blocks,
  # но не меньше min-rent-cap и не больше max-rent-cap
  max-rent-per-1000-blocks: 20
  min-rent-cap: 10
  max-rent-cap: 500
  # общий доступ арендодателя (он остаётся участником региона) возможен только для больших участков
  shared-access-min-volume: 2000
  # арендатор ломает только блоки, которые поставил сам
  tenant-break-own-only: true

# ---- Работники и зарплаты ----
# Управляющий предприятия размещает вакансии, игроки откликаются на доске объявлений (/district job board),
# управляющий принимает отклики. Зарплата: ставка за каждый полный блок времени, проведённого на участке,
# и/или процент от дохода (аренда номеров отеля, продажи магазина через ChestShop). Выплата идёт со счёта предприятия:
# нехватка средств копится как долг, при увольнении недостающее доплачивается из кошелька управляющего.
jobs:
  enabled: true
  # где можно нанимать
  categories: [shop, workshop, restaurant, warehouse, hotel]
  # сколько минут на участке составляют один оплачиваемый блок
  work-block-minutes: 30
  # предел ставки за блок и предел процента (на одного работника и суммарно по участку, с учётом числа мест)
  max-rate: 500
  max-percent: 30
  max-total-percent: 50
  max-slots-per-vacancy: 10
  max-vacancies-per-plot: 5
  # оплачиваемое время за сутки (минуты): защита от простоя на участке ради зарплаты
  max-work-minutes-per-day: 480
  max-jobs-per-player: 2
  max-applications-per-player: 3

# ---- Общий аукцион (zAuctionHouse) ----
# Вещи, которые игрок не забрал из хранилища за storage-days суток (и вещи, переданные администратором командой
# /district arrest auction <игрок>), выставляются на аукцион zAuctionHouse от имени казны. Деньги от продажи идут в казну.
# Работает на одном сервере без кластера. Без zAuctionHouse просроченное удаляется, как раньше.
auction:
  enabled: true
  # передавать просроченные вещи хранилищ на аукцион (иначе они удаляются)
  list-expired: true
  # имя продавца на аукционе
  seller-name: Казна
  # экономика zAuctionHouse, чью валюту использует казна (пусто - экономика по умолчанию)
  economy: ""
  # срок лота в сутках (0 - без срока: лот висит, пока его не купят)
  listing-days: 0
  # одновременно выставленных лотов казны не больше (0 - без ограничений) и лотов за один запуск
  max-listings: 500
  per-run: 20
  # цена: за предмет (по материалу или общая) × количество × множитель, не ниже min-lot-price
  default-price: 10
  min-lot-price: 1
  price-multiplier: 1.0
  prices:
    DIAMOND: 100
    EMERALD: 50
    GOLD_INGOT: 20
    IRON_INGOT: 8
    NETHERITE_INGOT: 800
    COBBLESTONE: 0.2
    DIRT: 0.1

# ---- Зачарования для станков ----
# Стол зачарований мастерской накладывает только одобренные администратором зачарования (/district enchant propose).
# Стоимость одного предмета: сам предмет + лазурит (lapis-base + lapis-per-level × уровень). Настоящие и кастомные зачарования
# (из датапаков) берутся из реестра игры. Зачарованные предметы выкладываются в сундук продукции или забираются управляющим
# (на витрину и по связи не идут).
enchanting:
  lapis-base: 1
  lapis-per-level: 2
  seconds-base: 8
  seconds-per-level: 4
  # уровни выше максимума игры (0 - нельзя); прибавка к максимальному уровню зачарования
  max-level-bonus: 0
  max-recipes-per-workshop: 20

# ---- Казна: субсидии, призы, выплаты ----
# Казна - фонд администрации: деньги не печатаются, расходуются только имеющиеся. Субсидия идёт на счёт предприятия
# (/district treasury subsidy), приз - игроку за мероприятие (/district treasury prize), всё попадает в журнал.
treasury:
  min-reason-length: 3      # причина обязательна
  max-single-payout: 0      # предел одной выплаты (0 - без предела)
  daily-limit: 0            # предел расходов казны за сутки (0 - без предела)

# ---- HTML-меню (плагин MC GUI) ----
# Если установлен MC GUI (https://github.com/resourcepack-ai/mcgui, нужен сервер 1.21.11+ и ресурспак), главное меню, банк и казна
# открываются как HTML-страницы. Игрок может выбрать своё: /district ui html|chest|auto.
# mode: auto - HTML, если MC GUI есть, иначе меню-сундук; html - то же; chest - всегда меню-сундук.
gui:
  mode: auto

# ---- Функции плагина ----
# Любую функцию можно отключить: она сразу блокируется для всех игроков и для администрации (команды, меню, фоновые расчёты).
# Переключение в игре: /district module <функция> on|off|reset (хранится в modules.yml и перекрывает это значение).
# Без электричества станки и отели работают без оплаты и без подключения к станциям.
modules:
  electricity: true
  hotels: true
  jobs: true
  services: true
  production: true
  enchanting: true
  goods: true
  player-plots: true
  treasury-payouts: true
  auction: true
  html-menus: true
  auto-balance: false
  webhooks: false
  plan: true
  holo-shop: true
  auto-build: true

# ---- Автокорректировка экономики ----
# Включается функцией auto-balance (modules: выше, /district module auto-balance on). Раз в interval-hours плагин сравнивает приток денег
# (заработок игроков за пределами плагина: игрок-часы × income-per-player-hour, либо фиксированное faucet-per-day) со стоком
# (приход в казну за сутки) и считает индекс цен = 1 + strength × (target-ratio - сток/приток) / target-ratio, в пределах index-min..index-max.
# Деньги копятся (сток мал) - индекс выше единицы: цена электричества, налоги и цены растут; изымаются слишком сильно - снижаются.
# Значения двигаются к «база × индекс» шагом не больше max-step-percent процентов базы за один запуск. База - значения из этого config.yml.
# Заданное администратором вручную (/district power admin base, /district bank admin ...) автокорректировка не трогает.
auto-balance:
  interval-hours: 24
  min-sample-hours: 6          # сколько часов данных об онлайне нужно для первого запуска
  target-ratio: 0.95
  strength: 0.8
  index-min: 0.7
  index-max: 1.5
  max-step-percent: 10
  income-per-player-hour: 600  # сколько игрок в среднем зарабатывает за час игры (работы, аукцион)
  faucet-per-day: 0            # либо фиксированный приток в сутки (0 - считать по игрокам)
  notify: admins               # кому писать в чат об изменениях: admins, all, none
  # что корректировать
  adjust:
    electricity: true
    rent-tax: true
    sales-tax: true
    property-tax: true
    services: true
    auction: true
  # пределы
  limits:
    electricity-min: 5
    electricity-max: 500
    rent-tax-min: 0
    rent-tax-max: 20
    sales-tax-min: 0
    sales-tax-max: 12

# ---- Вебхуки ----
# Включаются функцией webhooks (/district module webhooks on). Сводка показателей и события уходят в Discord, на форум XenForo или
# Invision Community либо на любой адрес с JSON. Запросы идут в отдельном потоке и не тормозят сервер.
# events: stats (периодическая сводка), balance (корректировка экономики), module (включение/выключение функций), payout (выплаты из казны).
# mode: edit - сводка правит одно и то же сообщение (Discord: PATCH, форумы: правка поста), new - каждый раз новое.
# sections: какие разделы включать (general, economy, electricity, production, hotels, work, goods, top); пусто - все.
# Примеры (раскомментируйте и подставьте свои адреса и ключи):
webhooks:
  endpoints: {}
  #  discord-main:
  #    type: discord
  #    url: "https://discord.com/api/webhooks/ID/TOKEN"
  #    username: IndustryReborn
  #    interval-minutes: 60
  #    events: [stats, balance, module, payout]
  #    mode: edit
  #  xenforo-news:
  #    type: xenforo
  #    url: "https://forum.example.com/api"     # адрес REST API XenForo 2
  #    api-key: "КЛЮЧ"
  #    api-user: 1                               # id пользователя, от имени которого пишем
  #    thread-id: 123                            # тема для сообщений (или node-id и title для создания темы)
  #    interval-minutes: 180
  #    events: [stats]
  #  invision-news:
  #    type: invision
  #    url: "https://forum.example.com/api"     # адрес REST API Invision Community
  #    api-key: "КЛЮЧ"
  #    author: 1                                 # id автора
  #    topic: 45                                 # тема (или forum и title для создания темы)
  #    interval-minutes: 180
  #  custom:
  #    type: json
  #    url: "https://example.com/hook"
  #    auth-header: "Bearer TOKEN"

# ---- Интеграция с Plan ----
# Если установлен Plan (https://github.com/plan-player-analytics/Plan) и включена функция plan, его панель получает вкладки
# IndustryReborn: район, экономика, электросеть, производство, отели, работа и заказы, товары, таблицы, а на страницах игроков - их участки,
# предприятия, выручка, аренда, работа и заказы. Данные обновляются раз в refresh-seconds.
plan:
  enabled: true
  refresh-seconds: 60

# ---- Торговля через голограммы ----
# Витрина-голограмма: над ней висят иконки товаров предприятия, под ними цена и остаток, по бокам стрелки листания. ПКМ по товару покупает один,
# Shift+ПКМ - до 16, ПКМ по стрелке перелистывает страницу. Создаёт управляющий: /district holoshop create <участок> (встаньте на место витрины
# и смотрите туда, откуда будут подходить покупатели). Нужны функции holo-shop и goods; иконки работают и на FancyHolograms, и на обычных сущностях.
holo-shop:
  items-per-page: 3          # сколько товаров на странице (1-5)
  max-per-plot: 2            # витрин на одно предприятие
  view-distance: 20          # дальность, с которой витрина появляется
  spacing: 1.3               # расстояние между товарами
  page-reset-seconds: 60     # через сколько секунд без кликов витрина возвращается на первую страницу
  click-cooldown-ms: 350     # защита от двойных кликов

# ---- Автостроительство ----
# При создании участка (/district create ...) на пустую площадку ставится здание из шаблона (папка buildings, формат .ir.json): вид здания
# запоминается как исходный, поэтому при освобождении участка оно восстанавливается. Тип здания подбирается по типу участка и размеру.
# /district create <номер> <тип> <цена> <аренда> build [здание] - выбрать здание, ... nobuild - не строить. Если на участке уже что-то построено,
# автоподбор молча пропускается (с сообщением), явный build - отказ. Готовые здания: /district build list, на существующий свободный участок: /district build.
auto-build:
  enabled: true
  on-create: true            # подбирать здание автоматически при создании участка
  blocks-per-tick: 2500      # сколько блоков ставить за тик (меньше - мягче для сервера)
  max-slope: 3               # допустимый перепад высоты земли под зданием
  synchronous: false         # ставить всё за один тик (для тестов)
  # здание по умолчанию для типа: название шаблона, auto (самое большое подходящее по размеру) или none
  defaults:
    house: auto
    shop: auto
    workshop: auto
    restaurant: auto
    warehouse: auto
    hotel: auto
    bank: auto
    power_plant: auto
